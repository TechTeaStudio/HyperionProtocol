name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  publish:
    # nuget.org Trusted Publishing: the reusable workflow exchanges a GitHub OIDC token for
    # a short-lived API key, so no NUGET_API_KEY secret is stored or passed.
    permissions:
      id-token: write
      contents: read
    uses: TechTeaStudio/.github/.github/workflows/nuget-publish-reusable.yml@main
    with:
      solution: src/TechTeaStudio.Protocols.Hyperion/TechTeaStudio.Protocols.Hyperion.sln
      projects_glob: src/*/*/*.csproj
